
spring.application.name=apigateway
server.port=8080

# Telemetry Service
spring.cloud.gateway.server.webflux.routes[0].id=telemetry-service
spring.cloud.gateway.server.webflux.routes[0].uri=${TELEMETRY_SERVICE_URL:http://localhost:8091}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/telemetry/**

# Telemetry Auth Service
spring.cloud.gateway.server.webflux.routes[1].id=telemetry-auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=${TELEMETRY_SERVICE_URL:http://localhost:8091}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/auth/**

# Incident Correlation Service
spring.cloud.gateway.server.webflux.routes[2].id=incident-correlation-service
spring.cloud.gateway.server.webflux.routes[2].uri=${INCIDENT_SERVICE_URL:http://localhost:8092}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/incidents/**

# AI Analysis Service
spring.cloud.gateway.server.webflux.routes[3].id=ai-analysis-service
spring.cloud.gateway.server.webflux.routes[3].uri=${AI_ANALYSIS_SERVICE_URL:http://localhost:8093}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/analysis/**
